name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Generated API types match the committed OpenAPI snapshot
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/assets | awk 'NR>1 {printf "- %s: %d KB\n", $9, $5/1024}' >> "$GITHUB_STEP_SUMMARY"
